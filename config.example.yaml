# Configurazione SSD Price Drop Poller (Black Friday)
# Copia questo file in config.yaml e compila con il tuo token Telegram

telegram_bot:
  # Inserisci il token rilasciato da @BotFather (es. "7123456789:AAFxxx...")
  token: "INSERISCI_QUI_IL_TUO_TOKEN_BOTFATHER"
  # ID chat dell'amministratore (opzionale)
  chat_id: 0
  fallback_to_tgpipe: false

amazon_affiliate:
  # Inserisci il tuo Tracking ID Amazon Associates (es. "nomestore-21")
  # Tutti i link inviati conterranno automaticamente il tuo tag!
  tag: ""

alert_rules:
  # Ore di attesa prima di reinviare un alert per lo stesso prodotto allo stesso prezzo
  cooldown_hours: 6
  # Invia notifica se viene battuto il minimo storico registrato nel database
  notify_on_all_time_low: true
  # Invia se lo sconto rispetto al prezzo di listino supera questa percentuale
  min_discount_percentage: 10

# Pausa tra le richieste HTTP (secondi) per rispettare i limiti di Amazon
poll_delay_seconds: 4

# Intervallo tra le scansioni automatiche in background (in minuti)
check_interval_minutes: 30

